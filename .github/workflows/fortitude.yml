name: Fortitude

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  linter_fortitude:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Run Fortitude Linter
    runs-on: ubuntu-latest
    steps:
      - name: Run Fortitude Linter
        uses: gha3mi/setup-fortran-conda@dev
        with:
          fortitude-check: true
          fortitude-settings: "--config-file tests/hello/fpm.toml --output-format github tests/hello"
