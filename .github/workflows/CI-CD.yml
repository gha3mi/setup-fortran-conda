name: Setup Fortran Conda CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/CI-CD.yml"
      - "action.yml"
      - "src/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "tests/hello/**"
      - "tests/mpi/**"
      - "tests/blas_lapack/**"
      - "tests/mpi_blas/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/CI-CD.yml"
      - "action.yml"
      - "src/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "tests/hello/**"
      - "tests/mpi/**"
      - "tests/blas_lapack/**"
      - "tests/mpi_blas/**"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * SAT"

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  test_fpm:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.os }}_${{ matrix.compiler }}_fpm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest,  compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: ifx,       compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: flang-new, compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: nvfortran, compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: aocc,      compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: aomp,      compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: lfortran,  compiler-version: "", extra-packages: "", fpm-version: "0.12.0"}
        - {os: windows-latest, compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: ifx,       compiler-version: "", extra-packages: "", fpm-version: "0.12.0"}
        - {os: windows-latest, compiler: flang-new, compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: lfortran,  compiler-version: "", extra-packages: "", fpm-version: "0.12.0"}
        - {os: macos-latest,   compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: macos-latest,   compiler: lfortran,  compiler-version: "", extra-packages: "", fpm-version: "0.12.0"}

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@dev
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler-version }}
          extra-packages: ${{ matrix.extra-packages }}
          fpm-version: ${{ matrix.fpm-version }}

      - name: fpm test (debug)
        working-directory: tests/hello
        run: |
          fpm test --target check --compiler ${{ env.FPM_FC }} --profile debug --verbose

      - name: fpm test (release)
        working-directory: tests/hello
        run: |
          fpm test --target check --compiler ${{ env.FPM_FC }} --profile release --verbose

  test_mpi_fpm:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.mpi }}_fpm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest,  compiler: gfortran,   compiler-version: "", mpi: mpich,    mpi-version: ""}
        - {os: ubuntu-latest,  compiler: gfortran,   compiler-version: "", mpi: openmpi,  mpi-version: ""}
        - {os: macos-latest,   compiler: gfortran,   compiler-version: "", mpi: mpich,    mpi-version: ""}
        - {os: macos-latest,   compiler: gfortran,   compiler-version: "", mpi: openmpi,  mpi-version: ""}
        - {os: ubuntu-latest,  compiler: ifx,        compiler-version: "", mpi: intelmpi, mpi-version: ""}
        - {os: windows-latest, compiler: ifx,        compiler-version: "", mpi: intelmpi, mpi-version: "", fpm-version: "0.12.0"}
        - {os: ubuntu-latest,  compiler: nvfortran,  compiler-version: "", mpi: hpcx,     mpi-version: ""}

    steps:
      - name: Setup Fortran and MPI
        uses: gha3mi/setup-fortran-conda@dev
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler-version }}
          mpi: ${{ matrix.mpi }}
          mpi-version: ${{ matrix.mpi-version }}
          fpm-version: ${{ matrix.fpm-version }}

      - name: fpm MPI test (debug)
        working-directory: tests/mpi
        run: |
          fpm test --target mpi_hello --profile debug --compiler "${{ env.MPIFC }}" --runner "${{ env.MPIEXEC }}" --runner-args=" ${{ env.MPIEXEC_NUMPROC_FLAG }} 2" --verbose

      - name: fpm MPI test (release)
        working-directory: tests/mpi
        run: |
          fpm test --target mpi_hello --profile release --compiler "${{ env.MPIFC }}" --runner "${{ env.MPIEXEC }}" --runner-args=" ${{ env.MPIEXEC_NUMPROC_FLAG }} 2" --verbose

  test_cmake:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.os }}_${{ matrix.compiler }}_cmake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest,  compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: ifx,       compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: flang-new, compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: nvfortran, compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: aocc,      compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: aomp,      compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: lfortran,  compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: ifx,       compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: flang-new, compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: lfortran,  compiler-version: "", extra-packages: ""}
        - {os: macos-latest,   compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: macos-latest,   compiler: lfortran,  compiler-version: "", extra-packages: ""}

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@dev
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler-version }}
          extra-packages: ${{ matrix.extra-packages }}

      - name: cmake test (debug)
        working-directory: tests/hello
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_Fortran_COMPILER=${{ env.CMAKE_Fortran_COMPILER }} -G Ninja
          cmake --build build/debug --config Debug --verbose
          ctest --test-dir build/debug --output-on-failure --no-tests=error -VV

      - name: cmake test (release)
        working-directory: tests/hello
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=${{ env.CMAKE_Fortran_COMPILER }} -G Ninja
          cmake --build build/release --config Release --verbose
          ctest --test-dir build/release --output-on-failure --no-tests=error -VV

  test_mpi_cmake:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.mpi }}_cmake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest,  compiler: gfortran,   compiler-version: "", mpi: mpich,    mpi-version: ""}
        - {os: ubuntu-latest,  compiler: gfortran,   compiler-version: "", mpi: openmpi,  mpi-version: ""}
        - {os: macos-latest,   compiler: gfortran,   compiler-version: "", mpi: mpich,    mpi-version: ""}
        - {os: macos-latest,   compiler: gfortran,   compiler-version: "", mpi: openmpi,  mpi-version: ""}
        - {os: ubuntu-latest,  compiler: ifx,        compiler-version: "", mpi: intelmpi, mpi-version: ""}
        - {os: windows-latest, compiler: ifx,        compiler-version: "", mpi: intelmpi, mpi-version: ""}
        - {os: ubuntu-latest,  compiler: nvfortran,  compiler-version: "", mpi: hpcx,     mpi-version: ""}

    steps:
      - name: Setup Fortran and MPI
        uses: gha3mi/setup-fortran-conda@dev
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler-version }}
          mpi: ${{ matrix.mpi }}
          mpi-version: ${{ matrix.mpi-version }}

      - name: CMake MPI test (debug)
        working-directory: tests/mpi
        run: |
          cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -DCMAKE_Fortran_COMPILER="${{ env.MPIFC }}" -DMPIEXEC_EXECUTABLE="${{ env.MPIEXEC }}" -G Ninja
          cmake --build build/debug --config Debug --verbose
          ctest --test-dir build/debug --output-on-failure --no-tests=error -VV

      - name: CMake MPI test (release)
        working-directory: tests/mpi
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="${{ env.MPIFC }}" -DMPIEXEC_EXECUTABLE="${{ env.MPIEXEC }}" -G Ninja
          cmake --build build/release --config Release --verbose
          ctest --test-dir build/release --output-on-failure --no-tests=error -VV

  test_meson:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.os }}_${{ matrix.compiler }}_meson
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest,  compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: ifx,       compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: flang-new, compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: nvfortran, compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: aocc,      compiler-version: "", extra-packages: ""}
        - {os: ubuntu-latest,  compiler: aomp,      compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: gfortran,  compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: ifx,       compiler-version: "", extra-packages: ""}
        - {os: windows-latest, compiler: flang-new, compiler-version: "", extra-packages: ""}
        - {os: macos-latest,   compiler: gfortran,  compiler-version: "", extra-packages: ""}

    steps:
      - name: Setup Fortran
        uses: gha3mi/setup-fortran-conda@dev
        with:
