name = "hello-test"

[build]
auto-executables = false
auto-tests = false
auto-examples = false
module-naming = false

[install]
library = false
test = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[test]]
name = "check"
source-dir = "test"
main = "check.f90"

[extra.ford]
project             = "test"
project_github      = "https://github.com/gha3mi/setup-fortran-conda"
author              = "Seyed Ali Ghasemi"
email               = "info@gha3mi.com"
github              = "https://github.com/gha3mi"
src_dir             = [
  "src",
  "test",
]
output_dir          = "../../doc/ford"
source              = true
incl_src            = true
graph               = true
coloured_edges      = true
search              = true
print_creation_date = true
sort                = "permission-alpha"
display             = ["public", "private", "protected"]

[extra.fortitude.check]
ignore = ["C003", "S061", "C121", "C001", "S241"]
