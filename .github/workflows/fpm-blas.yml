name: fpm BLAS/LAPACK

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  test_blas_fpm:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: ${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.blas }}_fpm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest,  compiler: gfortran,  blas: netlib,     fpm-version: ""}
        - {os: ubuntu-latest,  compiler: gfortran,  blas: openblas,   fpm-version: ""}
        - {os: ubuntu-latest,  compiler: gfortran,  blas: mkl,        fpm-version: ""}
        - {os: ubuntu-latest,  compiler: ifx,       blas: netlib,     fpm-version: ""}
        - {os: ubuntu-latest,  compiler: ifx,       blas: openblas,   fpm-version: ""}
        - {os: ubuntu-latest,  compiler: ifx,       blas: mkl,        fpm-version: ""}
        - {os: ubuntu-latest,  compiler: lfortran,  blas: mkl,        fpm-version: "0.12.0"}
        - {os: ubuntu-latest,  compiler: flang,     blas: netlib,     fpm-version: ""}
        - {os: ubuntu-latest,  compiler: flang,     blas: openblas,   fpm-version: ""}
        - {os: ubuntu-latest,  compiler: flang,     blas: mkl,        fpm-version: ""}
        - {os: ubuntu-latest,  compiler: flang-new, blas: netlib,     fpm-version: ""}
        - {os: ubuntu-latest,  compiler: flang-new, blas: openblas,   fpm-version: ""}
        - {os: ubuntu-latest,  compiler: flang-new, blas: mkl,        fpm-version: ""}
        - {os: ubuntu-latest,  compiler: nvfortran, blas: netlib,     fpm-version: ""}
        - {os: ubuntu-latest,  compiler: nvfortran, blas: openblas,   fpm-version: ""}
        - {os: ubuntu-latest,  compiler: nvfortran, blas: mkl,        fpm-version: ""}
        - {os: ubuntu-latest,  compiler: aocc,      blas: netlib,     fpm-version: ""}
        - {os: ubuntu-latest,  compiler: aocc,      blas: openblas,   fpm-version: ""}
        - {os: ubuntu-latest,  compiler: aocc,      blas: mkl,        fpm-version: ""}
        - {os: ubuntu-latest,  compiler: aomp,      blas: netlib,     fpm-version: ""}
        - {os: ubuntu-latest,  compiler: aomp,      blas: openblas,   fpm-version: ""}
        - {os: ubuntu-latest,  compiler: aomp,      blas: mkl,        fpm-version: ""}
        - {os: macos-latest,   compiler: gfortran,  blas: netlib,     fpm-version: ""}
        - {os: macos-latest,   compiler: gfortran,  blas: openblas,   fpm-version: ""}
        - {os: macos-26-intel, compiler: gfortran,  blas: mkl,        fpm-version: ""}
        - {os: macos-latest,   compiler: gfortran,  blas: accelerate, fpm-version: ""}
        - {os: macos-26-intel, compiler: lfortran,  blas: mkl,        fpm-version: "0.12.0"}
        - {os: windows-latest, compiler: gfortran,  blas: netlib,     fpm-version: ""}
        - {os: windows-latest, compiler: gfortran,  blas: openblas,   fpm-version: ""}
        - {os: windows-latest, compiler: gfortran,  blas: mkl,        fpm-version: ""}
        - {os: windows-latest, compiler: ifx,       blas: mkl,        fpm-version: "0.12.0"}
        - {os: windows-latest, compiler: flang,     blas: netlib,     fpm-version: ""}
        - {os: windows-latest, compiler: flang,     blas: openblas,   fpm-version: ""}
        - {os: windows-latest, compiler: flang,     blas: mkl,        fpm-version: ""}
        - {os: windows-latest, compiler: flang-new, blas: netlib,     fpm-version: ""}
        - {os: windows-latest, compiler: flang-new, blas: openblas,   fpm-version: ""}
        - {os: windows-latest, compiler: flang-new, blas: mkl,        fpm-version: ""}

    steps:
      - name: Setup Fortran and BLAS/LAPACK
        uses: gha3mi/setup-fortran-conda@dev
        with:
          compiler: ${{ matrix.compiler }}
          blas: ${{ matrix.blas }}
          fpm-version: ${{ matrix.fpm-version }}

      - name: fpm BLAS/LAPACK test
        working-directory: tests/blas_lapack
        run: fpm test --compiler "${{ env.FPM_FC }}" --profile release --verbose
