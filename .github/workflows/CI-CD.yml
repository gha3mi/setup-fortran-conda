name: Setup Fortran Conda CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/CI-CD.yml"
      - ".github/workflows/fpm.yml"
      - ".github/workflows/cmake.yml"
      - ".github/workflows/meson.yml"
      - ".github/workflows/fpm-mpi.yml"
      - ".github/workflows/cmake-mpi.yml"
      - ".github/workflows/meson-mpi.yml"
      - ".github/workflows/fpm-blas.yml"
      - ".github/workflows/cmake-blas.yml"
      - ".github/workflows/meson-blas.yml"
      - ".github/workflows/fpm-mpi-blas.yml"
      - ".github/workflows/cmake-mpi-blas.yml"
      - ".github/workflows/meson-mpi-blas.yml"
      - ".github/workflows/ford.yml"
      - ".github/workflows/doxygen.yml"
      - ".github/workflows/fortitude.yml"
      - ".github/workflows/status-fpm.yml"
      - ".github/workflows/status-cmake.yml"
      - ".github/workflows/status-meson.yml"
      - ".github/workflows/readme-table.yml"
      - "action.yml"
      - "src/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "tests/hello/**"
      - "tests/mpi/**"
      - "tests/blas_lapack/**"
      - "tests/mpi_blas/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/CI-CD.yml"
      - ".github/workflows/fpm.yml"
      - ".github/workflows/cmake.yml"
      - ".github/workflows/meson.yml"
      - ".github/workflows/fpm-mpi.yml"
      - ".github/workflows/cmake-mpi.yml"
      - ".github/workflows/meson-mpi.yml"
      - ".github/workflows/fpm-blas.yml"
      - ".github/workflows/cmake-blas.yml"
      - ".github/workflows/meson-blas.yml"
      - ".github/workflows/fpm-mpi-blas.yml"
      - ".github/workflows/cmake-mpi-blas.yml"
      - ".github/workflows/meson-mpi-blas.yml"
      - ".github/workflows/ford.yml"
      - ".github/workflows/doxygen.yml"
      - ".github/workflows/fortitude.yml"
      - ".github/workflows/status-fpm.yml"
      - ".github/workflows/status-cmake.yml"
      - ".github/workflows/status-meson.yml"
      - ".github/workflows/readme-table.yml"
      - "action.yml"
      - "src/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "tests/hello/**"
      - "tests/mpi/**"
      - "tests/blas_lapack/**"
      - "tests/mpi_blas/**"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * SAT"

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  fpm:
    uses: ./.github/workflows/fpm.yml

  cmake:
    uses: ./.github/workflows/cmake.yml

  meson:
    uses: ./.github/workflows/meson.yml

  fpm_mpi:
    uses: ./.github/workflows/fpm-mpi.yml

  cmake_mpi:
    uses: ./.github/workflows/cmake-mpi.yml

  meson_mpi:
    uses: ./.github/workflows/meson-mpi.yml

  fpm_blas:
    uses: ./.github/workflows/fpm-blas.yml

  cmake_blas:
    uses: ./.github/workflows/cmake-blas.yml

  meson_blas:
    uses: ./.github/workflows/meson-blas.yml

  fpm_mpi_blas:
    uses: ./.github/workflows/fpm-mpi-blas.yml

  cmake_mpi_blas:
    uses: ./.github/workflows/cmake-mpi-blas.yml

  meson_mpi_blas:
    uses: ./.github/workflows/meson-mpi-blas.yml

  ford:
    uses: ./.github/workflows/ford.yml

  doxygen:
    uses: ./.github/workflows/doxygen.yml

  fortitude:
    uses: ./.github/workflows/fortitude.yml

  # Reporting must run even when a required test workflow fails.
  status_fpm:
    if: ${{ always() }}
    needs: [fpm, fpm_mpi, fpm_blas, fpm_mpi_blas]
    uses: ./.github/workflows/status-fpm.yml

  status_cmake:
    if: ${{ always() }}
    needs: [cmake, cmake_mpi, cmake_blas, cmake_mpi_blas]
    uses: ./.github/workflows/status-cmake.yml

  status_meson:
    if: ${{ always() }}
    needs: [meson, meson_mpi, meson_blas, meson_mpi_blas]
    uses: ./.github/workflows/status-meson.yml

  update_readme_table:
    if: ${{ always() && github.ref == 'refs/heads/dev' }}
    needs: [fpm, fpm_mpi, fpm_blas, fpm_mpi_blas, cmake, cmake_mpi, cmake_blas, cmake_mpi_blas, meson, meson_mpi, meson_blas, meson_mpi_blas]
    uses: ./.github/workflows/readme-table.yml